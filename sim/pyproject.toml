[project]
name = "aimpire"
version = "0.0.1"
description = "Deterministic civilization research simulator with model-driven societies and god-game interventions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=1.11.0,<2",
    "httpx2>=2.13.1,<3",
    "numpy>=2.5.3,<3",
    "pydantic>=2.13.5,<3",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
aimpire = "aimpire.cli.main:main"
aim = "aimpire.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "hypothesis>=6.168.3,<7",
    "ruff>=0.16.10,<0.17",
    "pyright[nodejs]>=1.1.414,<1.2",
    "import-linter>=2.15,<3",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "acceptance: written before the code by the planning model; read-only for implementers (ADR-0016)",
]
