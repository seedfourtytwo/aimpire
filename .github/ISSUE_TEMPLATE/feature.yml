name: Feature / task
description: A unit of work sized for one agent session and one PR
labels: [feature]
body:
  - type: input
    id: epic
    attributes:
      label: Epic
      placeholder: "E5 — Action contract"
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable statements (name the tests).
    validations: { required: true }
  - type: textarea
    id: refs
    attributes:
      label: References
      description: ADRs, design sections, related issues.
  - type: checkboxes
    id: impact
    attributes:
      label: Expected impact
      options:
        - label: Touches schema/contracts (needs schema-first PR)
        - label: Changes golden hashes / rules version
        - label: Adds a dependency
