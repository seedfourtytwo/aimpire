name: Architecture decision
description: Propose or revisit an architectural decision (results in docs/adr/NNNN-*.md)
labels: [adr]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
    validations: { required: true }
  - type: textarea
    id: options
    attributes:
      label: Options considered
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed decision
  - type: input
    id: supersedes
    attributes:
      label: Supersedes ADR (if any)
