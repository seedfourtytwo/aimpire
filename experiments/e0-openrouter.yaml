# Experiment E0, optional breadth arm: one model through OpenRouter (paid).
#
# Run by hand only, with OPENROUTER_API_KEY set in the environment. It needs
# ../profiles/openrouter-e0.toml, which does not exist yet on purpose: copy
# profiles/openrouter-template.toml to that name and fill in a model id and
# both prices from the model's OpenRouter page (no id was verified for the
# template). Choose a model whose worst case fits: 30 runs x 24 councils x
# its worst call must stay under $20, so its worst call under about $0.027.
# Until the profile exists, `aimpire batch` stops with "profile file not found".
#   cd sim && uv run aimpire batch ../experiments/e0-openrouter.yaml --out runs/e0
# The model is named in the profile before the first run and never changed after.

id: e0-openrouter
preregistration: ../docs/experiments/e0-preregistration.md
hypothesis: >-
  E0 (confirmatory, breadth arm, primary condition): with named places and
  the regrowth rule hidden, the OpenRouter model keeps more of its people
  alive over two years than the greedy and random baselines, and no more
  than the half-full baseline.
metrics:
  primary: survival_ppm
  secondary: [final_near_camp_mu, deaths, final_stores_mu, usable_share_ppm,
              refusal_share_ppm, failure_share_ppm]
world: m0
ticks: 240 # two years of 120 days
council_every: 10
checkpoint_every: 30
seats: 1
seeds: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010]
replicates: 3
arms:
  - id: baselines
    knowledge_arm: A0
    renderer: places
    rules: hidden
    prompt: base
    models: [rule:random, rule:greedy, rule:half_full, rule:msy]
  - id: places-hidden
    knowledge_arm: A0
    renderer: places
    rules: hidden
    prompt: base
    models: [../profiles/openrouter-e0.toml]
