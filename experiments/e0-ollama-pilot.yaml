# Experiment E0, pilot (exploratory). Local model through Ollama: free.
#
# Run by hand only, on a machine with Ollama and `ollama pull qwen3:8b` done.
# Two seeds outside the confirmatory set, every arm. Its results are
# exploratory: they size the confirmatory runs (the rule in
# docs/experiments/e0-preregistration.md, "Seeds and stopping") and shake out
# reply-format problems. They are never pooled with the confirmatory runs.
#   cd sim && uv run aimpire batch ../experiments/e0-ollama-pilot.yaml --out runs/e0
# Expect several hours: 24 model runs of 24 councils each.

id: e0-ollama-pilot
preregistration: ../docs/experiments/e0-preregistration.md
hypothesis: >-
  Pilot of E0 (exploratory, no confirmatory claim): run-to-run spread of
  survival and reply validity of a local open-weight model in every arm.
metrics:
  primary: survival_ppm
  secondary: [final_near_camp_mu, deaths, final_stores_mu, usable_share_ppm,
              refusal_share_ppm, failure_share_ppm]
world: m0
ticks: 240 # two years of 120 days
council_every: 10
checkpoint_every: 30
seats: 1
seeds: [901, 902]
replicates: 3
arms:
  - id: baselines
    knowledge_arm: A0
    renderer: places
    rules: hidden
    prompt: base
    models: [rule:random, rule:greedy, rule:half_full, rule:msy]
  - id: places-hidden
    knowledge_arm: A0
    renderer: places
    rules: hidden
    prompt: base
    models: [../profiles/ollama-example.toml]
  - id: places-disclosed
    knowledge_arm: A0
    renderer: places
    rules: disclosed
    prompt: base
    models: [../profiles/ollama-example.toml]
  - id: grid-hidden
    knowledge_arm: A0
    renderer: grid
    rules: hidden
    prompt: base
    models: [../profiles/ollama-example.toml]
  - id: grid-disclosed
    knowledge_arm: A0
    renderer: grid
    rules: disclosed
    prompt: base
    models: [../profiles/ollama-example.toml]
