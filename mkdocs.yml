      - "0008 First-slice scope": adr/0008-first-slice-simulation-scope.md
      - "0009 Funding": adr/0009-funding-development-vs-cognition.md
      - "0010 Complexity ladder": adr/0010-complexity-ladder.md
      - "0011 Time & cadence": adr/0011-time-schedules-and-council-cadence.md
      - "0012 Numbers & draws": adr/0012-numeric-and-random-primitives.md
      - "0013 Mind interface": adr/0013-mind-interface.md
