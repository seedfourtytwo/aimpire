site_name: Aimpire
site_description: Retro civilization research simulator with AI civilizations and god-game interventions
repo_url: https://github.com/seedfourtytwo/aimpire
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      toggle: { icon: material/brightness-4, name: Light mode }
    - scheme: default
      primary: deep orange
      toggle: { icon: material/brightness-7, name: Dark mode }
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Specification: spec/original-handoff.md
  - Architecture: architecture/overview.md
  - Plan:
      - Roadmap: plan/roadmap.md
      - Backlog: plan/backlog.md
      - Open questions: plan/open-questions.md
      - Decision log: plan/decision-log.md
  - ADRs:
      - Index: adr/README.md
      - "0000 Template": adr/0000-template.md
      - "0001 Record decisions": adr/0001-record-architecture-decisions.md
      - "0002 Visual client": adr/0002-visual-client-stack.md
